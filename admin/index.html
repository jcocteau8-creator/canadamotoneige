<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Back-office | Canada Motoneige</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=12">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png">
</head>
<body>

<!-- Ecran de garde. ATTENTION : ce code n'est pas une securite, seulement
     un garde-fou visuel. Voir l'avertissement dans le module Parametres. -->
<div class="gate" id="gate">
  <form class="gate-box" id="gateForm">
    <img src="../assets/logo.png" alt="Canada Motoneige" class="gate-logo">
    <h1>Back-office</h1>
    <p>Accès réservé à l'équipe.</p>
    <input type="password" id="gatePin" placeholder="Code d'accès" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary">Entrer</button>
    <p class="gate-note" id="gateNote">Code par défaut : <b>0000</b> — à changer dans Paramètres.</p>
  </form>
</div>

<div class="app" id="app" hidden>

  <aside class="side">
    <a class="side-brand" href="../index.html">
      <img src="../assets/logo.png" alt="Canada Motoneige">
    </a>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="side-lock" id="btnLock">Verrouiller</button>
      <span class="side-ver" id="sideVer"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="burger-adm" id="burgerAdm" aria-label="Menu"><span></span><span></span><span></span></button>
      <h2 id="pageTitle">Tableau de bord</h2>
      <div class="topbar-actions" id="topActions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">Titre</h3>
      <button class="modal-x" id="modalClose" aria-label="Fermer">&times;</button>
    </div>
    <form id="modalForm"><div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="modalCancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js?v=12"></script>
</body>
</html>
